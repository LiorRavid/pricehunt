<div class="space-y-6">
  <header class="space-y-1">
    <h1 class="text-2xl font-semibold tracking-tight">Search shipping prices</h1>
    <p class="text-slate-600">
      Quotes appear as each supplier answers, cheapest first. A search stops after 6 seconds.
    </p>
  </header>

  @if (catalog.error()) {
    <div
      role="alert"
      class="flex flex-wrap items-center gap-3 rounded-card bg-rose-50 px-4 py-3 text-rose-800"
    >
      <span>The suppliers could not be loaded. Is the API running?</span>
      <button
        type="button"
        class="rounded-md border border-rose-300 px-3 py-1 text-sm font-medium hover:bg-rose-100"
        (click)="reloadSuppliers()"
      >
        Try again
      </button>
    </div>
  }

  <ph-search-form
    [suppliers]="suppliers()"
    [searching]="store.searching()"
    (searchRequested)="startSearch($event)"
    (cancelRequested)="cancelSearch()"
  />

  <ph-progress-panel
    [searching]="store.searching()"
    [progress]="store.progress()"
    [badge]="store.badge()"
    [maxDurationMs]="store.maxDurationMs()"
  />

  @if (store.phase() !== 'idle') {
    <ph-results-list [rows]="store.rows()" />
  }
</div>
