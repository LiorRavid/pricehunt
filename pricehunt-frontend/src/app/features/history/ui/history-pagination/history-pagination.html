<nav
  aria-label="Pagination"
  class="flex flex-wrap items-center justify-between gap-x-6 gap-y-3 text-sm text-slate-600"
>
  <p aria-live="polite">
    @if (summary().firstItem > 0) {
      Showing {{ summary().firstItem }}–{{ summary().lastItem }} of {{ summary().totalCount }}
    } @else {
      No results
    }
  </p>

  <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
    <label class="inline-flex items-center gap-2">
      Rows per page
      <select
        #sizeSelect
        id="history-page-size"
        class="h-8 rounded-md border border-slate-300 bg-white px-2 text-slate-900"
        (change)="changePageSize(sizeSelect.value)"
      >
        @for (size of pageSizes; track size) {
          <option [value]="size" [selected]="size === pageSize()">{{ size }}</option>
        }
      </select>
    </label>

    <div class="flex items-center gap-1">
      <button
        type="button"
        aria-label="First page"
        class="grid size-8 place-items-center rounded-md border border-slate-300 bg-white hover:bg-slate-50 disabled:opacity-40"
        [disabled]="summary().page <= 1"
        (click)="pageChange.emit(1)"
      >
        <span aria-hidden="true">«</span>
      </button>
      <button
        type="button"
        aria-label="Previous page"
        class="grid size-8 place-items-center rounded-md border border-slate-300 bg-white hover:bg-slate-50 disabled:opacity-40"
        [disabled]="summary().page <= 1"
        (click)="pageChange.emit(summary().page - 1)"
      >
        <span aria-hidden="true">‹</span>
      </button>
      <span class="px-2 whitespace-nowrap">
        Page {{ summary().page }} of {{ summary().pageCount }}
      </span>
      <button
        type="button"
        aria-label="Next page"
        class="grid size-8 place-items-center rounded-md border border-slate-300 bg-white hover:bg-slate-50 disabled:opacity-40"
        [disabled]="summary().page >= summary().pageCount"
        (click)="pageChange.emit(summary().page + 1)"
      >
        <span aria-hidden="true">›</span>
      </button>
      <button
        type="button"
        aria-label="Last page"
        class="grid size-8 place-items-center rounded-md border border-slate-300 bg-white hover:bg-slate-50 disabled:opacity-40"
        [disabled]="summary().page >= summary().pageCount"
        (click)="pageChange.emit(summary().pageCount)"
      >
        <span aria-hidden="true">»</span>
      </button>
    </div>
  </div>
</nav>
