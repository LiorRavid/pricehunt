<div class="flex items-center gap-3">
  <div
    ngCombobox
    #combobox="ngCombobox"
    [(expanded)]="expanded"
    [preserveContent]="true"
    [attr.aria-labelledby]="labelledBy()"
    class="flex h-10 min-w-0 flex-1 cursor-pointer items-center justify-between gap-2 rounded-md border border-slate-300 bg-white px-3 text-left text-sm"
  >
    <span class="truncate">{{ summary() }}</span>
    <svg
      aria-hidden="true"
      viewBox="0 0 20 20"
      fill="currentColor"
      class="size-4 shrink-0 text-slate-500"
    >
      <path
        fill-rule="evenodd"
        d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.17l3.71-3.94a.75.75 0 1 1 1.08 1.04l-4.25 4.5a.75.75 0 0 1-1.08 0l-4.25-4.5a.75.75 0 0 1 .02-1.06Z"
        clip-rule="evenodd"
      />
    </svg>
  </div>
  @if (selection().length > 0) {
    <button
      type="button"
      aria-label="Clear supplier filter"
      class="shrink-0 text-sm font-medium text-accent-700 hover:underline"
      (click)="clear()"
    >
      Clear
    </button>
  }
</div>

<ng-template
  [cdkConnectedOverlay]="{ origin: combobox.element, usePopover: 'inline', matchWidth: true }"
  [cdkConnectedOverlayOpen]="expanded()"
>
  <ng-template ngComboboxPopup [combobox]="combobox">
    <!-- Focus stays on the combobox, which points at the active option (aria-activedescendant). -->
    <div
      class="mt-1 max-h-72 w-full overflow-auto rounded-md border border-slate-200 bg-white p-1 shadow-lg"
      (mousedown)="$event.preventDefault()"
    >
      <div
        ngListbox
        ngComboboxWidget
        #listbox="ngListbox"
        [multi]="true"
        focusMode="activedescendant"
        selectionMode="explicit"
        [tabindex]="-1"
        [value]="selection()"
        (valueChange)="choose($event)"
        [activeDescendant]="listbox.activeDescendant()"
        [attr.aria-labelledby]="labelledBy()"
      >
        @for (supplier of suppliers(); track supplier.id) {
          <div
            ngOption
            [value]="supplier.id"
            [label]="supplier.name"
            class="group flex cursor-pointer items-center gap-2 rounded px-2 py-1.5 text-sm data-[active=true]:bg-slate-100"
          >
            <span
              aria-hidden="true"
              class="flex size-4 shrink-0 items-center justify-center rounded border border-slate-400 group-aria-selected:border-accent-700 group-aria-selected:bg-accent-700"
            >
              <svg
                viewBox="0 0 16 16"
                fill="none"
                class="size-3 text-white opacity-0 group-aria-selected:opacity-100"
              >
                <path
                  d="M3.5 8.5 6.5 11.5 12.5 4.5"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            <span>{{ supplier.name }}</span>
          </div>
        }
      </div>
    </div>
  </ng-template>
</ng-template>
