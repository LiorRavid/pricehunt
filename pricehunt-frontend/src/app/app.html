<header class="border-b border-slate-200 bg-white">
  <nav aria-label="Main" class="mx-auto flex max-w-5xl items-center gap-6 px-4 py-3">
    <a routerLink="/search" class="text-lg font-semibold tracking-tight text-slate-900">
      Price<span class="text-accent-700">Hunt</span>
    </a>
    <ul class="flex gap-1">
      @for (link of links; track link.path) {
        <li>
          <a
            [routerLink]="link.path"
            routerLinkActive="bg-accent-50 text-accent-800"
            ariaCurrentWhenActive="page"
            class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>
  </nav>
</header>
<main class="mx-auto max-w-5xl px-4 py-6">
  <router-outlet />
</main>
